# Release bump on dev.
#
# A push to dev runs this workflow. The guard runs on that push. It skips the
# release app's own bump commit when the actor is the app bot, or when the head
# commit message has a Release-Version trailer. That path logs
# "bump commit from the release app; skipping" and exits successfully.
#
# Any other push is matched to a merged pull request. The guard reads
# repos/<repo>/commits/<sha>/pulls with the default GITHUB_TOKEN (contents and
# pull requests, read-only). It continues only when exactly one pull request has
# merged_at set, base ref dev, and merge_commit_sha equal to this commit. Any
# other push logs "push to dev is not a pull request merge; skipping" and exits
# successfully.
#
# The bump commit and the annotated rc tag are pushed with a GitHub App token
# so the tag push starts .github/workflows/release.yaml. The workflow
# GITHUB_TOKEN stays read-only and is used for the pull request lookup.
#
# GitHub merge commits use the pull request merge. The bump job checks out dev
# and reads the tip again before it commits, because this sha may no longer be
# the tip if another push landed first. The retry loop recomputes the rc in
# that case. The ref update is an atomic push without --force. An existing tag
# stops the run and is left in place.
#
# workflow_dispatch is the owner-run path. It tags the current dev tip when
# that tip has no tag. The pull request number is 0.
#
# The bump commit has no skip-ci marker. CI still runs on that commit.

name: Release bump (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# The default queue keeps one pending run and cancels older pending runs.
# queue: max keeps them, so three merges that land close together each get an rc.
concurrency:
  group: release-bump-dev
  cancel-in-progress: false
  queue: max

jobs:
  bump:
    name: Bump and tag rc
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Guard
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          event_name="${EVENT_NAME:-}"
          actor="${ACTOR:-}"
          app_slug="${APP_SLUG:-}"
          app_id="${APP_ID:-}"
          sha="${SHA:-}"
          repository="${REPOSITORY:-}"
          skip=false
          pr_number=""
          pr_labels="[]"
          merge_sha=""

          message_has_prefix_line() {
            MESSAGE="$1" PREFIX="$2" awk '
              BEGIN {
                n = split(ENVIRON["MESSAGE"], lines, "\n")
                plen = length(ENVIRON["PREFIX"])
                for (i = 1; i <= n; i++) {
                  if (substr(lines[i], 1, plen) == ENVIRON["PREFIX"]) exit 0
                }
                exit 1
              }
            '
          }

          skip_with_notice() {
            echo "::notice::$1"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          case "${event_name}" in
            push)
              if [ -n "${app_slug}" ] && [ "${actor}" = "${app_slug}[bot]" ]; then
                skip_with_notice "bump commit from the release app; skipping"
              fi
              printf '%s' "${repository}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || {
                echo "unexpected repository" >&2
                exit 1
              }
              printf '%s' "${sha}" | grep -Eq '^[0-9a-f]{40}$' || {
                echo "unexpected commit sha" >&2
                exit 1
              }
              commit_json="$(gh api "repos/${repository}/commits/${sha}")"
              head_message="$(printf '%s' "${commit_json}" | jq -r '.commit.message // ""')"
              if message_has_prefix_line "${head_message}" "Release-Version:"; then
                skip_with_notice "bump commit from the release app; skipping"
              fi
              # Pages are slurped, then flattened. One merged PR into dev wins.
              pulls_json="$(gh api --paginate --slurp "repos/${repository}/commits/${sha}/pulls?per_page=100")"
              matches="$(printf '%s' "${pulls_json}" | jq -c --arg sha "${sha}" '
                [ .[][]
                  | select(.merged_at != null and .base.ref == "dev" and .merge_commit_sha == $sha)
                ]
              ')"
              count="$(printf '%s' "${matches}" | jq 'length')"
              if [ "${count}" = "0" ]; then
                skip_with_notice "push to dev is not a pull request merge; skipping"
              fi
              if [ "${count}" != "1" ]; then
                skip_with_notice "push to dev matches more than one merged pull request; skipping"
              fi
              pr_number="$(printf '%s' "${matches}" | jq -r '.[0].number')"
              pr_labels="$(printf '%s' "${matches}" | jq -c '[.[0].labels // [] | .[].name]')"
              case "${pr_number}" in
                ''|*[!0-9]*)
                  echo "pull request number must be an integer" >&2
                  exit 1
                  ;;
              esac
              case "${pr_labels}" in
                '['*']') ;;
                *)
                  echo "pull request labels are not a JSON array" >&2
                  exit 1
                  ;;
              esac
              labels_oneline="$(printf '%s' "${pr_labels}" | tr -d '\n')"
              if [ "${labels_oneline}" != "${pr_labels}" ]; then
                echo "pull request labels are not a single line" >&2
                exit 1
              fi
              merge_sha="${sha}"
              ;;
            workflow_dispatch)
              pr_number="0"
              pr_labels="[]"
              merge_sha=""
              if [ -n "${app_slug}" ] && [ "${actor}" = "${app_slug}[bot]" ]; then
                echo "::notice::actor is ${app_slug}[bot]; no rc created"
                skip=true
              fi
              ;;
            *)
              echo "unexpected event ${event_name}" >&2
              exit 1
              ;;
          esac

          if [ -z "${app_id}" ]; then
            echo "::warning::release app not configured; no rc created"
            skip=true
          fi

          if [ "${skip}" = "true" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "skip=false"
            echo "pr_number=${pr_number}"
            echo "merge_sha=${merge_sha}"
            echo "pr_labels=${pr_labels}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub App token
        id: app-token
        if: steps.guard.outputs.skip != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout dev
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Bump, tag, and push
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ steps.guard.outputs.pr_number }}
          PR_LABELS: ${{ steps.guard.outputs.pr_labels }}
          MERGE_SHA: ${{ steps.guard.outputs.merge_sha }}
        run: |
          set -euo pipefail

          event_name="${EVENT_NAME:-}"
          pr_number="${PR_NUMBER:-0}"
          app_slug="${APP_SLUG:-}"
          pr_labels="${PR_LABELS:-[]}"
          merge_sha="${MERGE_SHA:-}"

          case "${event_name}" in
            push|workflow_dispatch)
              ;;
            *)
              echo "unexpected event ${event_name}" >&2
              exit 1
              ;;
          esac
          case "${pr_number}" in
            *[!0-9]*)
              echo "pull request number must be an integer" >&2
              exit 1
              ;;
          esac
          if [ "${event_name}" = "push" ] && [ "${pr_number}" = "0" ]; then
            echo "merged pull request is missing a number" >&2
            exit 1
          fi
          if [ -z "${app_slug}" ]; then
            echo "RELEASE_APP_SLUG is empty" >&2
            exit 1
          fi

          bot_name="${app_slug}[bot]"
          bot_id="$(gh api "/users/${bot_name}" --jq .id)"
          case "${bot_id}" in
            *[!0-9]*|'')
              echo "release app user id is not an integer" >&2
              exit 1
              ;;
          esac
          bot_email="${bot_id}+${bot_name}@users.noreply.github.com"
          export GIT_AUTHOR_NAME="${bot_name}"
          export GIT_AUTHOR_EMAIL="${bot_email}"
          export GIT_COMMITTER_NAME="${bot_name}"
          export GIT_COMMITTER_EMAIL="${bot_email}"
          git config user.name "${bot_name}"
          git config user.email "${bot_email}"
          git config commit.gpgsign false
          git config tag.gpgsign false

          message_has_exact_line() {
            MESSAGE="$1" LINE="$2" awk '
              BEGIN {
                n = split(ENVIRON["MESSAGE"], lines, "\n")
                for (i = 1; i <= n; i++) if (lines[i] == ENVIRON["LINE"]) exit 0
                exit 1
              }
            '
          }

          message_has_prefix_line() {
            MESSAGE="$1" PREFIX="$2" awk '
              BEGIN {
                n = split(ENVIRON["MESSAGE"], lines, "\n")
                plen = length(ENVIRON["PREFIX"])
                for (i = 1; i <= n; i++) {
                  if (substr(lines[i], 1, plen) == ENVIRON["PREFIX"]) exit 0
                }
                exit 1
              }
            '
          }

          history_has_exact_line() {
            git log --format='%B%x00' | LINE="$1" awk '
              BEGIN { wanted = ENVIRON["LINE"] }
              {
                gsub(/\0/, "\n")
                n = split($0, lines, "\n")
                for (i = 1; i <= n; i++) if (lines[i] == wanted) found = 1
              }
              END { exit found ? 0 : 1 }
            '
          }

          label=""
          case "${pr_labels}" in
            *'"release:major"'*)
              label="release:major"
              ;;
            *'"release:minor"'*)
              label="release:minor"
              ;;
            *'"release:patch"'*)
              label="release:patch"
              ;;
          esac

          sync_dev() {
            git fetch --tags origin refs/heads/dev
            tip="$(git ls-remote origin refs/heads/dev | awk 'NR==1 { print $1 }')"
            if ! printf '%s' "${tip}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "unexpected origin/dev tip: ${tip}" >&2
              exit 1
            fi
            if ! git cat-file -e "${tip}^{commit}" 2>/dev/null; then
              git fetch origin "${tip}"
            fi
            git reset --hard "${tip}"
          }

          created_tag=""
          attempt=1
          while [ "${attempt}" -le 5 ]; do
            sync_dev

            if [ -n "${merge_sha}" ] && git cat-file -e "${merge_sha}^{commit}" 2>/dev/null; then
              merge_msg="$(git log -1 --format=%B "${merge_sha}")"
              if message_has_prefix_line "${merge_msg}" "Release-Version:"; then
                echo "::notice::merge commit carries the release bump marker; no rc created"
                exit 0
              fi
            fi

            pr_line="Release-PR: ${pr_number}"
            head_msg="$(git log -1 --format=%B HEAD)"
            head_has_pr=false
            if message_has_exact_line "${head_msg}" "${pr_line}"; then
              head_has_pr=true
            fi
            tip_tags="$(git tag --points-at HEAD --list 'v*')"

            if [ "${event_name}" = "workflow_dispatch" ]; then
              if [ -n "${tip_tags}" ]; then
                echo "::notice::dev tip is already tagged; no rc created"
                exit 0
              fi
            else
              if [ -n "${tip_tags}" ] && [ "${head_has_pr}" = "true" ]; then
                echo "::notice::dev tip tag already covers pull request ${pr_number}; no rc created"
                exit 0
              fi
              if history_has_exact_line "${pr_line}"; then
                echo "::notice::a bump commit for pull request ${pr_number} is already on dev; no rc created"
                exit 0
              fi
            fi

            if [ -n "${label}" ]; then
              version="$(go run -mod=readonly ./cmd/release-bump next -label "${label}")"
            else
              version="$(go run -mod=readonly ./cmd/release-bump next)"
            fi
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$'; then
              echo "release-bump next returned an unexpected version: ${version}" >&2
              exit 1
            fi
            tag="v${version}"

            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "tag ${tag} already exists locally; not overwriting it" >&2
              exit 1
            fi
            if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
              echo "tag ${tag} already exists on origin; not overwriting it" >&2
              exit 1
            fi

            go run -mod=readonly ./cmd/release-bump "${version}"
            git add -- VERSION
            if git diff --cached --quiet; then
              echo "VERSION did not change for ${version}" >&2
              exit 1
            fi

            msg_file="$(mktemp)"
            {
              printf 'chore(release): %s\n\n' "${tag}"
              printf 'Release-Version: %s\n' "${version}"
              printf 'Release-PR: %s\n' "${pr_number}"
            } > "${msg_file}"
            git commit -F "${msg_file}"
            rm -f "${msg_file}"
            git tag -a "${tag}" -m "chore(release): ${tag}"
            created_tag="${tag}"

            push_log="$(mktemp)"
            if git push --atomic origin "HEAD:refs/heads/dev" "refs/tags/${tag}" >"${push_log}" 2>&1; then
              cat "${push_log}"
              rm -f "${push_log}"
              sha="$(git rev-parse HEAD)"
              {
                echo "### Release candidate"
                echo ""
                echo "- Version: \`${version}\`"
                echo "- Tag: \`${tag}\`"
                echo "- Commit: \`${sha}\`"
                echo "- PR: ${pr_number}"
              } >> "${GITHUB_STEP_SUMMARY}"
              echo "tagged ${tag} at ${sha} for pull request ${pr_number}"
              exit 0
            fi
            cat "${push_log}"
            if grep -F "already exists" "${push_log}" >/dev/null; then
              echo "tag ${tag} already exists on origin; not overwriting or deleting it" >&2
              rm -f "${push_log}"
              exit 1
            fi
            dev_moved=false
            if grep -E 'non-fast-forward|fetch first|tip of your current branch is behind' "${push_log}" >/dev/null; then
              dev_moved=true
            fi
            rm -f "${push_log}"
            if [ "${dev_moved}" != "true" ]; then
              echo "git push failed; the rc tag was not pushed" >&2
              exit 1
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "dev moved before the bump could be pushed; tried 5 times and stopped" >&2
              exit 1
            fi
            echo "dev moved; recomputing the rc (attempt ${attempt} of 5)"
            git tag -d "${created_tag}"
            created_tag=""
            attempt=$((attempt + 1))
          done
          echo "dev moved before the bump could be pushed; tried 5 times and stopped" >&2
          exit 1
