x-minikms-service: &minikms-service
  build: .
  depends_on:
    postgres-test:
      condition: service_healthy
    redis-test:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "nc", "-z", "localhost", "50051"]
    interval: 3s
    timeout: 5s
    retries: 10

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: minikms_test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: minikms_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minikms_test -d minikms_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:15-alpine
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    environment:
      PGPASSWORD: testpass
    entrypoint:
      - sh
      - -c
      - |
        psql -h postgres-test -U minikms_test -d minikms_test -f /migrations/001_initial_schema.sql &&
        psql -h postgres-test -U minikms_test -d minikms_test -f /migrations/002_vault_storage.sql &&
        psql -h postgres-test -U minikms_test -d minikms_test -f /migrations/003_escrow_recovery.sql &&
        psql -h postgres-test -U minikms_test -d minikms_test -f /migrations/004_multi_replica_ha.sql

  minikms-1:
    <<: *minikms-service
    environment: *minikms-environment
    ports:
      - "50051:50051"

  minikms-2:
    <<: *minikms-service
    environment: *minikms-environment
    ports:
      - "50052:50051"
