# Example only. Do not commit real miniKMS keys or connection strings.
# Prefer an ExternalSecret, Secrets Store CSI driver, or your platform's
# equivalent to create these two Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: minikms-backend
type: Opaque
stringData:
  db-url: REPLACE_WITH_POSTGRES_URL
  redis-url: REPLACE_WITH_REDIS_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: minikms-runtime-secrets
type: Opaque
stringData:
  root-key: REPLACE_WITH_64_HEX_CHARACTERS
  root-ca.crt: |
    REPLACE_WITH_ROOT_CA_CERTIFICATE_PEM
  root-ca.key: |
    REPLACE_WITH_P384_ROOT_CA_PRIVATE_KEY_PEM
  session-signing-key.pem: |
    REPLACE_WITH_P256_SESSION_SIGNING_PRIVATE_KEY_PEM
