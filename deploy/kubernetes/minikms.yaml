apiVersion: v1
kind: Service
metadata:
  name: minikms
  labels:
    app.kubernetes.io/name: minikms
spec:
  selector:
    app.kubernetes.io/name: minikms
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: minikms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minikms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minikms
  labels:
    app.kubernetes.io/name: minikms
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minikms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minikms
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minikms
          image: ghcr.io/envsync-cloud/minikms:REPLACE_WITH_RELEASE
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
          env:
            - name: MINIKMS_GRPC_ADDR
              value: 0.0.0.0:50051
            - name: MINIKMS_DB_URL
              valueFrom:
                secretKeyRef:
                  name: minikms-backend
                  key: db-url
            - name: MINIKMS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: minikms-backend
                  key: redis-url
            - name: MINIKMS_ROOT_KEY_FILE
              value: /var/run/secrets/minikms/root-key
            - name: MINIKMS_ROOT_CA_CERT_FILE
              value: /var/run/secrets/minikms/root-ca.crt
            - name: MINIKMS_ROOT_CA_KEY_FILE
              value: /var/run/secrets/minikms/root-ca.key
            - name: MINIKMS_SESSION_SIGNING_KEY_FILE
              value: /var/run/secrets/minikms/session-signing-key.pem
          volumeMounts:
            - name: runtime-secrets
              mountPath: /var/run/secrets/minikms
              readOnly: true
          readinessProbe:
            grpc:
              port: 50051
              service: minikms
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
              service: minikms
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: runtime-secrets
          secret:
            secretName: minikms-runtime-secrets
            defaultMode: 0440
